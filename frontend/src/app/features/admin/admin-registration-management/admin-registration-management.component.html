<div class="container">
  <h1 class="title">Quản lý Đăng ký</h1>

  <div class="filter-bar">
    <input
      type="text"
      class="filter-input"
      [(ngModel)]="searchTerm"
      placeholder="Tìm kiếm theo tên, email, SĐT..."
      (keyup.enter)="onSearch()"
    />
    <select class="filter-select" [(ngModel)]="filterCourseId">
      <option [ngValue]="null">Tất cả khóa học</option>
      <option *ngFor="let c of courses" [ngValue]="c.id">{{ c.title }}</option>
    </select>
    <button type="button" class="btn-search" (click)="onSearch()">Tìm kiếm</button>
  </div>

  <div class="table-wrapper" *ngIf="!loading">
    <table class="data-table">
      <thead>
        <tr>
          <th>ID</th>
          <th>Họ tên</th>
          <th>Số điện thoại</th>
          <th>Email</th>
          <th>Khóa học</th>
          <th>Ngày sinh</th>
          <th>Trạng thái</th>
          <th>Ngày đăng ký</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let reg of registrations">
          <td>{{ reg.id }}</td>
          <td>{{ reg.full_name }}</td>
          <td>{{ reg.phone }}</td>
          <td>{{ reg.email }}</td>
          <td>{{ reg.course_title || '-' }}</td>
          <td>{{ reg.date_of_birth }}</td>
          <td>
            <select
              class="status-select"
              [class.badge-new]="reg.status === 'new'"
              [class.badge-consulted]="reg.status === 'consulted'"
              [class.badge-confirmed]="reg.status === 'confirmed'"
              [class.badge-cancelled]="reg.status === 'cancelled'"
              [ngModel]="reg.status"
              (ngModelChange)="updateStatus(reg, $event)"
            >
              <option value="new">Mới</option>
              <option value="consulted">Đã tư vấn</option>
              <option value="confirmed">Đã xác nhận</option>
              <option value="cancelled">Đã hủy</option>
            </select>
          </td>
          <td>{{ reg.created_at | date:'dd/MM/yyyy HH:mm' }}</td>
        </tr>
      </tbody>
    </table>
  </div>

  <div class="loading" *ngIf="loading">Đang tải...</div>
</div>
